##########################################################################
## Minimal GAMBIT configuration for testing the SusHi 1.7.0 backend.
##
## Computes gg->h and bb->h cross sections at NNLO, LHC 13 TeV
## for a single MSSM9 test point with mh ~ 125 GeV.
##
## Requires: -DBUILD_FS_MODELS="MSSM_mAmu"
##
## Expected: SusHi_ggh_xsec ~ 20-50 pb, SusHi_bbh_xsec ~ 1-5 pb
##########################################################################

Parameters:

  StandardModel_SLHA2: !import include/StandardModel_SLHA2_defaults.yaml

  MSSM9batQ_mA:
    Qin:      10000.0
    TanBeta:  10.0
    mA:       2000.0
    mu:       500.0
    M1:       300.0
    M2:       600.0
    M3:       1500.0
    mq2_3:    4000000.0
    msf2:     4000000.0
    Au_3:     -3000.0


Priors:


Printer:

  printer: cout


Scanner:

  use_scanner: random

  scanners:

    random:
      plugin: random
      point_number: 1
      output_file:  output
      like:  LogLike
      files:
        output_file: "weights ..."


ObsLikes:

    - purpose:    Observable
      capability: SusHi_ggh_xsec

    - purpose:    Observable
      capability: SusHi_bbh_xsec

    - purpose:    Observable
      capability: MSSM_spectrum
      type:       map_str_dbl


Rules:

  - capability: unimproved_MSSM_spectrum
    function: get_MSSMatQ_mA_spectrum_FS
    options:
      precision_goal:        1.0e-4
      max_iterations:        0
      calculate_sm_masses:   false
      pole_mass_loop_order:  2
      ewsb_loop_order:       2
      beta_loop_order:       2
      threshold_corrections_loop_order: 2
      use_higgs_2loop_at_as: true
      use_higgs_2loop_ab_as: true
      use_higgs_2loop_at_at: true
      use_higgs_2loop_atau_atau: true
      invalid_point_fatal: false

  - capability: MSSM_spectrum
    function: make_MSSM_precision_spectrum_none

  - capability: SusHi_ggh_xsec
    function: getSusHi_ggh_xsec

  - capability: SusHi_bbh_xsec
    function: getSusHi_bbh_xsec


Logger:

  redirection:
    [Default]    : "stdout"
    [Debug]      : "stdout"
    [ColliderBit] : "stdout"
    [SpecBit]    : "stdout"
    [PrecisionBit] : "stdout"


KeyValues:

  default_output_path: "runs/SusHi_test"

  dependency_resolution:
    prefer_model_specific_functions: true

  likelihood:
    model_invalid_for_lnlike_below: -1e6

  debug: true
