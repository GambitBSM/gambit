settings:
  nominal_weight_name: Weight
  # Optional source-event provenance in JSON; off to keep real-run output compact.
  trace_input_events: false
  # Same SLHA point, independent seeds 27/33/39; 10,000 events in each file.
  # The process cross section is the event-count-weighted MEAN, not a sum.
  # Uncertainty is numerical MadGraph integration error only (quadrature of
  # independent run errors with the same averaging weights), not theory/PDF error.
  processes:
    - name: EWino
      cross_section_pb: 1.536816497638584
      cross_section_uncert_pb: 0.001046120181347737
      files:
        - /Users/p.zhu/Gambit-Workshop/CBS/EWinos/Events/run_02/tag_1_pythia8_events.hepmc.gz
        - /Users/p.zhu/Gambit-Workshop/CBS/EWinos/Events/run_03/tag_1_pythia8_events.hepmc.gz
        - /Users/p.zhu/Gambit-Workshop/CBS/EWinos/Events/run_04/tag_1_pythia8_events.hepmc.gz
  debug: false
  seed: 12345
  output: ./runs/CBS_SUSYRun2_HepMC.json
  screen_output: true
  jet_collections:
    antikt_R04: {algorithm: antikt, R: 0.4, recombination_scheme: E_scheme, strategy: Best}
    antikt_R08: {algorithm: antikt, R: 0.8, recombination_scheme: E_scheme, strategy: Best}
    antikt_R1:  {algorithm: antikt, R: 1.0, recombination_scheme: E_scheme, strategy: Best}
  jet_collection_taus: antikt_R04
  use_lognormal_distribution_for_1d_systematic: true
  use_covariances: true
  use_marginalising: false
  combine_SRs_without_covariances: false
  nuisance_prof_initstep: 0.1
  nuisance_prof_convtol: 0.01
  nuisance_prof_maxsteps: 10000
  nuisance_prof_convacc: 0.01
  nuisance_prof_simplexsize: 1.0e-8
  nuisance_prof_method: 5
  calc_noerr_loglikes: true
  calc_expected_loglikes: true
  calc_expected_noerr_loglikes: true

