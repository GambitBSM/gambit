##########################################################################
## 2D CMSSM scan exercising the HiggsTools backend.
##
## Sweeps M0 and M12 on a regular grid at fixed (A0=0, tan(beta)=10,
## sign(mu)=+1).  Evaluates only the LHC HiggsSignals likelihood from
## HiggsTools, to confirm that:
##   - the scan completes for many points
##   - LHC_Higgs_LogLike varies sensibly across (M0, M12)
##   - no NaN or backend crash from the cached Python Higgs.signals
##     and Higgs.bounds objects under repeated calls
##
## Output goes to runs/HiggsTools_CMSSM_2D_test/ as ASCII so the result
## is straightforward to inspect.  Not a physics scan.
##########################################################################


Parameters:

  StandardModel_SLHA2: !import include/StandardModel_SLHA2_defaults.yaml

  CMSSM:
    M0:
      range: [200, 5000]
    M12:
      range: [200, 5000]
    A0: 0
    TanBeta: 10
    SignMu: 1


Priors:
  # All priors are simple and specified directly via the parameter ranges.


Printer:

  printer: ascii
  options:
    output_file: "HiggsTools_CMSSM_2D_test.txt"
    delete_file_on_restart: true


Scanner:

  use_scanner: grid

  scanners:

    grid:
      plugin: grid
      like:  LogLike
      grid_pts: [10, 10]
      output_path: "runs/HiggsTools_CMSSM_2D_test/grid"


ObsLikes:

  - capability: LHC_Higgs_LogLike
    purpose:    LogLike

  # Also surface a couple of intermediate observables to check the
  # underlying chain produced sensible numbers per point.
  - capability: mh
    purpose:    Observable
    type:       triplet<double>


Rules:

  # Use SUSY-HIT (via partial widths) for Higgs couplings.
  - if:
      capability: Higgs_Couplings
    then:
      function: MSSM_higgs_couplings_pwid

  # Use the table-based reference SM Higgs decays (no FeynHiggs).
  - if:
      capability: Reference_SM_Higgs_decay_rates
    then:
      function: Ref_SM_Higgs_decays_table
  - if:
      capability: Reference_SM_other_Higgs_decay_rates
    then:
      function: Ref_SM_other_Higgs_decays_table
  - if:
      capability: Reference_SM_A0_decay_rates
    then:
      function: Ref_SM_A0_decays_table

  # Use SUSY-HIT for MSSM Higgs decays.
  - if:
      capability: Higgs_decay_rates
    then:
      function: MSSM_h0_1_decays
  - if:
      capability: h0_2_decay_rates
    then:
      function: h0_2_decays
  - if:
      capability: A0_decay_rates
    then:
      function: A0_decays
  - if:
      capability: H_plus_decay_rates
    then:
      function: H_plus_decays

  # DecayBit-native top decays (no FeynHiggs).
  - if:
      capability: t_decay_rates
    then:
      function: t_decays

  # FlexibleSUSY CMSSM spectrum.
  - if:
      capability: unimproved_MSSM_spectrum
    then:
      function: get_CMSSM_spectrum_FS
      options:
        precision_goal:        1.0e-4
        max_iterations:        0
        calculate_sm_masses:   false
        pole_mass_loop_order:  2
        ewsb_loop_order:       2
        beta_loop_order:       2
        threshold_corrections_loop_order: 2
        use_higgs_2loop_at_as: true
        use_higgs_2loop_ab_as: true
        use_higgs_2loop_at_at: true
        use_higgs_2loop_atau_atau: true
        invalid_point_fatal: false

  - if:
      capability: MSSM_spectrum
      type: Spectrum
    then:
      function: make_MSSM_precision_spectrum_none


Logger:
  redirection:
    [Default]      : "default.log"
    [SpecBit]      : "SpecBit.log"
    [DecayBit]     : "DecayBit.log"
    [PrecisionBit] : "PrecisionBit.log"
    [ColliderBit]  : "ColliderBit.log"


KeyValues:

  default_output_path: "runs/HiggsTools_CMSSM_2D_test/"

  likelihood:
    model_invalid_for_lnlike_below: -5e5
    model_invalid_for_lnlike_below_alt: -1e5
    print_invalid_points: true

  debug: false
