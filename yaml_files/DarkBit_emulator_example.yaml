########################################################################
## Minimal DarkBit emulator example: ScalarSingletDM_Z2 relic density
##
## Demonstrates the GAMBIT emulator framework applied to the scalar
## singlet DM relic density Omega h^2 = f(mS, lambda_hS).
##
## Run with:  mpirun -n 2 ./gambit -f yaml_files/DarkBit_emulator_example.yaml
##   Rank 0 = GAMBIT main process
##   Rank 1 = EGG emulator process
########################################################################

Parameters:

  StandardModel_SLHA2: !import include/StandardModel_SLHA2_scan.yaml

  StandardModel_Higgs:
    mH:
      fixed_value: 125.25

  ScalarSingletDM_Z2:
    mS:
      range: [45., 10000.]
      prior_type: log
    lambda_hS:
      range: [0.0001, 10.00]
      prior_type: log


Priors:


Printer:
  printer: cout


Scanner:
  use_scanner: random
  scanners:
    random:
      plugin: random
      point_number: 500
      like: LogLike
      printme: false


ObsLikes:

  - purpose: LogLike
    capability: lnL_oh2

  - purpose: Observable
    capability: RD_oh2


Emulation:

  use_emulator:
    - RD_oh2_ScalarSingletDM_Z2_emulatable

  emulators:
    RD_oh2_ScalarSingletDM_Z2_emulatable:
      # plugin: emutest
      # train: true
      # predict: true
      # uncertainty:
      #   - 0.001

      # Uncomment below to use the full GP tree emulator instead:
      plugin: pygptreeo
      train: true
      predict: true
      uncertainty:
        - 0.01
      max_cache_size: 50
      Nbar: 100
      theta: 1e-4
      split_position_method: median
      split_dimension_criteria: max_variance
      retrain_every_n_points: 50
      use_calibrated_sigma: true
      splitting_strategy: gradual
      pre_trained: false


Rules:

  # Use the emulatable function for the relic density capability
  - capability: RD_oh2
    function: RD_oh2_ScalarSingletDM_Z2_emulatable

  # DarkSUSY 6.4.0 initialisation
  - capability: RD_oh2_DS6_ini
    function: RD_oh2_DS6_ini_func
    options:
      fast: 1

  # Relic density likelihood as upper limit (Planck constraint)
  - capability: lnL_oh2
    function: lnL_oh2_upperlimit
    options:
      oh2_obs: 0.1188
      oh2_obserr: 0.001
      profile_systematics: false
      oh2_fractional_theory_error: 0.05

  # Use SpecBit's simple tree-level spectrum for ScalarSingletDM_Z2
  - capability: ScalarSingletDM_Z2_spectrum
    function: get_ScalarSingletDM_Z2_spectrum

  # Use internal decay rates (no SLHA file)
  - capability: decay_rates
    function: all_decays


Logger:
  redirection:
    [Default]:  "default.log"

KeyValues:
  default_output_path: "runs/DarkBit_emulator_example"
  debug: false
