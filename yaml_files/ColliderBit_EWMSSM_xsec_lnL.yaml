##########################################################################
##
## A GAMBIT configuration file for scanning the EWMSSM with a simple
## Gaussian likelihood on the Pythia initial cross-section.
##
## This is much faster than the full LHC analysis chain, making it
## useful for testing emulator performance and scanner behaviour.
##
## The likelihood is:  lnL = -0.5 * (xsec - mu)^2 / sigma^2
## with defaults mu=100 fb, sigma=10 fb (configurable in Rules section).
##
## Build with:  cmake -DBUILD_FS_MODELS="MSSM_mAmu" ...
##
##########################################################################

Parameters:

  # SM parameters.
  StandardModel_SLHA2: !import include/StandardModel_SLHA2_defaults.yaml

  # MSSM parameters
  MSSM11atQ_mA:
    M1: 1
    M2:
      prior_type: flat
      range: [0, 1500]
    mu:
      prior_type: flat
      range: [-1500, 1500]
    TanBeta: 10
    Ad_3: 0.0
    Ae_3: 0.0
    Au_3: 0.0
    M3: 5.0e3
    Qin: 3.0e3
    mA: 5.0e3
    ml2: 9.0e6
    mq2: 9.0e6


Priors:

  # All priors simple, so specified in Parameters section


Printer:

  printer: hdf5_v1
  options:
    output_file: "EWMSSM_xsec_lnL.hdf5"
    group: "/data"
    delete_file_on_restart: true
    buffer_length: 2


Scanner:

  use_scanner: de

  scanners:

    random:
      plugin: random
      point_number: 1000
      output_file:  output
      like:  LogLike
      files:
        output_file: "weights ..."

    de:
      plugin: diver
      like: LogLike
      NP: 800
      convthresh: 1e-12
      verbosity: 1

    scipy_differential_evolution:
      like: LogLike
      plugin: scipy_differential_evolution
      run:
        strategy: 'best1bin'
        maxiter: 1000
        popsize: 15
        tol: 0.01
        mutation: [0.5, 1]
        recombination: 0.7
        disp: false
        polish: true
        init: 'latinhypercube'
        atol: 0
        updating: 'immediate'


Emulation:

  use_emulator:
    - PerformInitialCrossSection_Pythia

  emulators:
    PerformInitialCrossSection_Pythia:
      plugin: pygptreeo
      train: true
      predict: true
      uncertainty:
        - 0.01
      max_cache_size: 50
      Nbar: 100
      theta: 1e-4
      split_position_method: median
      split_dimension_criteria: max_variance
      retrain_every_n_points: 50
      use_calibrated_sigma: true
      splitting_strategy: gradual
      pre_trained: false
      log_emulator_data: true


ObsLikes:

    # Simple Gaussian likelihood on the Pythia initial cross-section
    - purpose:    LogLike
      capability: InitialCrossSection_Pythia_LogLike

    - purpose:    Observable
      capability: InitialCrossSection_Pythia_value

    - purpose:    Observable
      capability: InitialCrossSection_Pythia_relerr

    - purpose:    Observable
      capability: MSSM_spectrum
      type:       map_str_dbl

    - purpose:    Observable
      capability: PerformInitialCrossSection
      printme: false
      printisemulated: true


Rules:

  # Choose to get decays from DecayBit proper, not from an SLHA file.
  - capability: decay_rates
    function: all_decays

  # Gaussian lnL options: true cross-section and width (both in fb)
  - capability: InitialCrossSection_Pythia_LogLike
    options:
      xsec_true_fb:  100.0
      xsec_sigma_fb:  10.0

  # Cross-section calculation via Pythia (emulated)
  - capability: PerformInitialCrossSection
    function: PerformInitialCrossSection_Pythia
    options:
      silenceLoop: true
      LHC_13TeV:
        nEvents: 100
        maxFailedEvents: 10
        pythia_settings:
          - Beams:eCM = 13000
          - Next:numberCount = 0
          - Next:numberShowProcess = 0
          - Print:quiet = on
          - Random:setSeed = on
          - PartonLevel:MPI = off
          - PartonLevel:ISR = on
          - PartonLevel:FSR = on
          - HadronLevel:all = on
          - SUSY:all = off
          - SUSY:qqbar2chi0chi0 = on
          - SUSY:qqbar2chi+-chi0 = on
          - SUSY:qqbar2chi+chi- = on
          - TauDecays:mode = 0
          - TimeShower:pTmin = 2
          - 23:mMin = 0.1
          - 24:mMin = 0.1

  # Require a small, additional mass difference before switching on new decay modes in the
  # limit of small chargino--neutralino mass difference.
  - capability: chargino_plus_1_decay_rates_smallsplit
    function: chargino_plus_1_decays_smallsplit
    options:
      m_safety: 0.0011

  # Choose to get the spectrum from SpecBit proper, not an SLHA file.
  - capability: unimproved_MSSM_spectrum
    function: get_MSSMatQ_mA_spectrum_FS
    options:
      precision_goal:        1.0e-4
      max_iterations:        0
      calculate_sm_masses:   false
      pole_mass_loop_order:  2
      ewsb_loop_order:       2
      beta_loop_order:       2
      threshold_corrections_loop_order: 2
      use_higgs_2loop_at_as: true
      use_higgs_2loop_ab_as: true
      use_higgs_2loop_at_at: true
      use_higgs_2loop_atau_atau: true
      invalid_point_fatal: false
      mass_cut: [ ["|~chi+_1|", 45., 1e6] ]
      override_FS_pole_masses:
        h0_1: 125.09
      only_neutralino_LSP: true

  # Relabel unimproved_MSSM_spectrum to MSSM_spectrum
  - capability: MSSM_spectrum
    type: Spectrum
    function: make_MSSM_precision_spectrum_none

  # Globally permit maximal mixing between gauge and family eigenstates
  - if:
      function: any
    then:
      options:
        gauge_mixing_tolerance: 0.5
        family_mixing_tolerance: 0.5

  # Higgs and top decays
  - capability: Higgs_decay_rates
    function: MSSM_h0_1_decays
  - capability: h0_2_decay_rates
    function: h0_2_decays
  - capability: A0_decay_rates
    function: A0_decays
  - capability: H_plus_decay_rates
    function: H_plus_decays
  - capability: t_decay_rates
    function: t_decays

  # Pass an SLHA2 spectrum to Pythia
  - capability: SpectrumAndDecaysForPythia
    function: getSpectrumAndDecaysForPythia
    options:
      slha_version: 2
      write_summary_to_log: false


Logger:

  redirection:
    [Debug] : "debug.log"
    [Default] : "default.log"
    [Dependency Resolver] : "dep_resolver.log"


KeyValues:

  rng:
    generator: default
    seed: -1

  dependency_resolution:
    prefer_model_specific_functions: true
    unused_rule_is_an_error: false

  print_timing_data: true

  likelihood:
    model_invalid_for_lnlike_below: -5e5
    print_invalid_points: false

  default_output_path: "runs/EWMSSM_xsec_lnL_1/"

  debug: false
