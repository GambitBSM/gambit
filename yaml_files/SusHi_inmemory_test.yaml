##########################################################################
## Test of the in-memory SusHi 1.7.0 interface: 3 random MSSM9 points,
## no emulator.  write_slha_input: 1 makes the frontend dump the exact
## input handed to SusHi for each point, for a standalone cross-check.
##########################################################################

Parameters:

  StandardModel_SLHA2: !import include/StandardModel_SLHA2_defaults.yaml

  MSSM9batQ_mA:
    Qin:      10000.0
    TanBeta:
      range: [5.0, 20.0]
      prior_type: flat
    mA:       2000.0
    mu:       500.0
    M1:       300.0
    M2:       600.0
    M3:       1500.0
    mq2_3:    4000000.0
    msf2:     4000000.0
    Au_3:     -3000.0

Priors:

Printer:
  printer: cout

Scanner:
  use_scanner: random
  scanners:
    random:
      plugin: random
      point_number: 3
      output_file:  output
      like:  LogLike
      files:
        output_file: "weights ..."

ObsLikes:
    - purpose:    Observable
      capability: SusHi_h_xsec_total_cap

Rules:

  - capability: unimproved_MSSM_spectrum
    function: get_MSSMatQ_mA_spectrum_FS
    options:
      precision_goal:        1.0e-4
      max_iterations:        0
      calculate_sm_masses:   false
      pole_mass_loop_order:  2
      ewsb_loop_order:       2
      beta_loop_order:       2
      threshold_corrections_loop_order: 2
      use_higgs_2loop_at_as: true
      use_higgs_2loop_ab_as: true
      use_higgs_2loop_at_at: true
      use_higgs_2loop_atau_atau: true
      invalid_point_fatal: false

  - capability: MSSM_spectrum
    function: make_MSSM_precision_spectrum_none

  - capability: SusHi_h_xsec_total_cap
    function: getSusHi_h_xsec_total
    options:
      write_slha_input: 1

Logger:
  # Debug-level logging shows the frontend's per-point ggh and bbh results
  # (and the name of the dumped input file) in the log.
  debug: true
  redirection:
    [Default]    : "stdout"
    [Debug]      : "stdout"

KeyValues:
  default_output_path: "runs/SusHi_inmemory_test"
  dependency_resolution:
    prefer_model_specific_functions: true
  likelihood:
    model_invalid_for_lnlike_below: -1e6
  debug: false
