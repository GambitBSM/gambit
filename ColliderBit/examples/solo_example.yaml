# Simple example input file for running CBS
# Pat Scott May 2019

analyses:
  - CMS_SUS_16_033
  - CMS_SUS_16_043
  - CMS_SUS_16_034_EW
  - CMS_SUS_16_048
  - CMS_SUS_16_051
  - CMS_SUS_17_001
  - CMS_SUS_16_039
  - CMS_SUS_16_048
  - ATLAS_SUSY_2016_07
  - ATLAS_SUSY_2016_24
  - ATLAS_SUSY_2016_15
  - ATLAS_SUSY_2017_01
  - ATLAS_SUSY_2016_28

settings:
  # Allow explicitly unvalidated analyses only when debugging an analysis.
  debug: false
  check_cutflow: false
  seed: -1
  event_file: susy10.hepmc
  # CBS reads run conditions from the two HepMC beam particles and runs only
  # matching analyses. Existing ATLAS/CMS Ecm_TeV metadata implies p+p beams
  # with equal beam energies; explicit Beams/Energies metadata takes precedence.
  collision_energy_tolerance_GeV: 1.0
  # Rivet-style per-beam compatibility checks: relative tolerance or absolute tolerance.
  beam_energy_tolerance_GeV: 1.0
  beam_energy_relative_tolerance: 0.001
  cross_section_pb: 1.0
  cross_section_fractional_uncert: 0.2
  use_lognormal_distribution_for_1d_systematic: true
  target_fractional_uncert: 0.3
  halt_when_systematic_dominated: true
  all_analyses_must_converge: false
  all_SR_must_converge: false
  covariance_marg_convthres_abs: 0.05
  covariance_marg_convthres_rel: 0.05
  covariance_nsamples_start: 100000 
  output: ./runs/CBS_result.json
  screen_output: true
  jet_collections:
    antikt_R04:
      algorithm: antikt
      R: 0.4
      recombination_scheme: E_scheme
      strategy: Best
  jet_collection_taus: antikt_R04
