# Complete CBS YAML template (updated for current solo.cpp / solo_input.cpp)
# Date: 2026-02-16
#
# IMPORTANT:
# 1. Choose exactly one input mode:
#    - Mode A: settings.processes (recommended for multi-file / multi-process runs)
#    - Mode B: settings.event_file (legacy single-file mode)
# 2. Do NOT mix settings.processes with settings.event_file.
# 3. CBS always processes all events in user-provided HepMC files (no convergence-based early stop).

analyses:
  - ATLAS_EXOT_2019_04
  - ATLAS_EXOT_2016_017
  # - ATLAS_CONF_2019_008

settings:
  # Basic run controls
  debug: true
  seed: 1337

  # Runtime cutflow control (effective when compiled with CHECK_CUTFLOW)
  check_cutflow: true

  # --------------------------------------------------------------------------
  # Input Mode A (recommended): process-based multi-file input
  # --------------------------------------------------------------------------
  processes:
    - name: EWino
      cross_section_fb: 1841.0
      cross_section_uncert_fb: 3.46
      files:
        - /Users/p.zhu/Workshop/GambitWS/CBS/events/ewino_01.hepmc
        - /Users/p.zhu/Workshop/GambitWS/CBS/events/ewino_02.hepmc

    - name: slepton
      cross_section_fb: 75.49
      cross_section_uncert_fb: 0.10
      files:
        - /Users/p.zhu/Workshop/GambitWS/CBS/events/slepton_01.hepmc
        - /Users/p.zhu/Workshop/GambitWS/CBS/events/slepton_02.hepmc

  # files may be given as plain strings or as mappings with file/filename keys.
  # Event counts are always read from the HepMC files directly.

  # --------------------------------------------------------------------------
  # Input Mode B (legacy single-file mode): uncomment and disable Mode A
  # --------------------------------------------------------------------------
  # event_file: /path/to/sample.hepmc
  # cross_section_fb: 10.0
  # cross_section_uncert_fb: 1.0
  # Alternative xsec styles are also supported:
  # cross_section_pb + cross_section_uncert_pb
  # cross_section_fb + cross_section_fractional_uncert
  # cross_section_pb + cross_section_fractional_uncert


  # --------------------------------------------------------------------------
  # Batch-mode extras (used when settings.processes is active)
  # --------------------------------------------------------------------------
  # If omitted, CBS uses [target_fractional_uncert, 0.10, 0.05]
  # Here target_fractional_uncert is only used for post-run sampling advice.
  target_fractional_uncert: 0.30
  sampling_advice_targets: [0.30, 0.10, 0.05]

  # Keep temporary per-file YAML/JSON artifacts from batch runner
  keep_batch_tmp: true

  # Optional combined-loglike controls (mainly relevant for merged/batch result)
  # alt_loglike: marginalised
  # skip_analyses: [ATLAS_EXOT_2019_04]
  # cap_loglike_individual_analyses: false
  # cap_loglike: false

  # --------------------------------------------------------------------------
  # Jet definitions (required)
  # --------------------------------------------------------------------------
  jet_collections:
    antikt_R04:
      algorithm: "antikt"
      R: 0.4
      recombination_scheme: "E_scheme"
      strategy: "Best"
    antikt_R10:
      algorithm: "antikt"
      R: 1.0
      recombination_scheme: "E_scheme"
      strategy: "Best"

  # Jet collection used for hadronic tau association
  jet_collection_taus: antikt_R04

  # Optional VR jets (needed only for analyses that use event->vrjets("<key>"))
  VRJet_collections:
    VRTrackJets:
      rho: 30.0
      Rmin: 0.02
      Rmax: 0.40
      pt_min: 5.0

  # --------------------------------------------------------------------------
  # Output controls
  # --------------------------------------------------------------------------
  screen_output: true
  output: ./runs/CBS_result.json
