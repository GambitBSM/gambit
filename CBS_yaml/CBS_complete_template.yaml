# Complete CBS YAML template (multi-process mode)
# - Supports multiple physical processes
# - Supports multiple HepMC files per process
# - Supports runtime cutflow control

analyses:
  - ATLAS_EXOT_2019_04
  # - ATLAS_EXOT_2016_017
  # - ATLAS_CONF_2019_008

settings:
  # Basic run controls
  debug: true
  seed: 1337

  # Runtime cutflow control (single CBS switch)
  # Requires compile-time CHECK_CUTFLOW to be enabled.
  check_cutflow: false

  # Event input mode: process-based (do not mix with event_file mode)
  processes:
    # Process A: one physical process, multiple HepMC chunks
    - name: EWino
      cross_section_fb: 1841.0
      cross_section_uncert_fb: 3.46
      files:
        - file: /Users/p.zhu/Workshop/GambitWS/CBS/events/ewino_01.hepmc
          generated_events: 10000
        - file: /Users/p.zhu/Workshop/GambitWS/CBS/events/ewino_02.hepmc
          generated_events: 10000

    # Process B: another independent physical process contribution
    - name: slepton
      cross_section_fb: 75.49
      cross_section_uncert_fb: 0.0001
      files:
        - file: /Users/p.zhu/Workshop/GambitWS/CBS/events/slepton_01.hepmc
          generated_events: 10000
        - file: /Users/p.zhu/Workshop/GambitWS/CBS/events/slepton_02.hepmc
          generated_events: 10000

  # Loop / likelihood options (optional but commonly used)
  use_lognormal_distribution_for_1d_systematic: true
  events_between_convergence_checks: 50000
  target_fractional_uncert: 0.30
  # Optional: explicit targets for post-run MC top-up advice in process mode.
  # If omitted, CBS uses [target_fractional_uncert, 0.10, 0.05].
  # sampling_advice_targets: [0.30, 0.10, 0.05]
  halt_when_systematic_dominated: true
  all_analyses_must_converge: false
  all_SR_must_converge: false
  covariance_marg_convthres_abs: 0.05
  covariance_marg_convthres_rel: 0.05
  covariance_nsamples_start: 1000

  # Jet collections (required by current CBS workflow)
  jet_collections:
    antikt_R04:
      algorithm: "antikt"
      R: 0.4
      recombination_scheme: "E_scheme"
      strategy: "Best"
    antikt_R10:
      algorithm: "antikt"
      R: 1.0
      recombination_scheme: "E_scheme"
      strategy: "Best"

  # Optional: name of jet collection used for hadronic taus
  jet_collection_taus: antikt_R04

  # Optional VR jets (only needed for analyses that use VR track jets)
  VRJet_collections:
    VRTrackJets:
      rho: 30.0
      Rmin: 0.02
      Rmax: 0.40
      pt_min: 5.0

  # Output
  screen_output: true
  output: /Users/p.zhu/Workshop/GambitWS/YourCase/runs/CBS_result.json
  output_format: json
  output_schema: cbs-solo-loglike-v1
  output_json_indent: 2
