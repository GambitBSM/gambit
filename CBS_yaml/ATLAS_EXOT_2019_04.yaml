# Simple example input file for running CBS
# Pat Scott May 2019

#TP 19th Jul 2019 - just fiddled slightly with the original to take a hepmc file from
#the ATLAS_0Lep analysis (generated in PYTHIA) which we are using to verify CBS.
#Settings adjusted accordingly.

#EDIT TP Jul 22nd - using input from GAMBIT to esnure consistency.generate

analyses:
  - ATLAS_EXOT_2019_04
  # - CMS_SUS_19_012

settings:
  debug: true
  seed: 1337
  check_cutflow: true
  processes:
    - name: EWino
      cross_section_fb: 37.38
      cross_section_uncert_fb: 0.001
      files:
        - /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singleB_1200_10K_01.hepmc
        - /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singleB_1200_10K_02.hepmc
        - /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singleB_1200_10K_03.hepmc
  # event_file: /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singletB_1200_50K.hepmc
  # cross_section_fb: 37.38
  # event_file: /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singletB_1600_50K.hepmc
  # cross_section_fb: 22.705
  # event_file: /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singletB_2000_50K.hepmc
  # cross_section_fb: 17.564

  jet_collections:
    antikt_R04:
      algorithm: "antikt"
      R: 0.4
      recombination_scheme: "E_scheme"
      strategy: "Best"
    antikt_R10:
      algorithm: "antikt"
      R: 1.0
      recombination_scheme: "E_scheme"
      strategy: "Best"
  VRJet_collections:
    VRTrackJets:
      rho: 30.0
      Rmin: 0.02
      Rmax: 0.4
      pt_min: 5.0
  output: ./runs/CBS_result.json
  screen_output: true