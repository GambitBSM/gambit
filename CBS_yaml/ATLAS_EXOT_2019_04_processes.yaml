# CBS input example (process-oriented, multi-HepMC)
# This is a template for the new structure discussed:
# - organize inputs by physical process
# - multiple files under one process are treated as extra MC statistics

analyses:
  - ATLAS_EXOT_2019_04
  # - CMS_SUS_16_034

settings:
  debug: true
  cutflow: false
  # normalized_cutflows: false
  seed: 1337

  # Physical-process based inputs
  processes:
    - name: singletB_1200
      cross_section_fb: 37.38
      cross_section_uncert_fb: 0.3738
      files:
        - /Users/p.zhu/Workshop/GambitWS/ATLAS_EXOT_2019_04/Events/singletB_1200_50K.hepmc
        # Add more HepMC files for the same process to increase statistics:
        # - /path/to/singletB_1200_part2.hepmc

    # Example for another independent physical process contribution:
    # - name: another_process
    #   cross_section_fb: 1.25
    #   cross_section_uncert_fb: 0.10
    #   files:
    #     - /path/to/another_process.hepmc

  max_nEvent: 50000
  use_lognormal_distribution_for_1d_systematic: true
  events_between_convergence_checks: 50000
  target_fractional_uncert: 0.3
  halt_when_systematic_dominated: true
  all_analyses_must_converge: false
  all_SR_must_converge: false
  covariance_marg_convthres_abs: 0.05
  covariance_marg_convthres_rel: 0.05
  covariance_nsamples_start: 1000

  jet_collections:
    antikt_R04:
      algorithm: "antikt"
      R: 0.4
      recombination_scheme: "E_scheme"
      strategy: "Best"
    antikt_R10:
      algorithm: "antikt"
      R: 1.0
      recombination_scheme: "E_scheme"
      strategy: "Best"

  VRJet_collections:
    VRTrackJets:
      rho: 30.0
      Rmin: 0.02
      Rmax: 0.4
      pt_min: 5.0

  output: ./runs/CBS_result.json
  output_json_indent: 4
  screen_output: true
