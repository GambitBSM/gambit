# CBS default settings.
#
# Merge order:
#   1. top-level settings below
#   2. settings for each requested analysis, in YAML analysis order
#   3. user input YAML settings
#
# User settings always override these defaults.

settings:
  jet_collection_taus: antikt_R04
  # CBS always processes the whole HepMC input; this sets the event-block
  # size and hence the cadence of the live completed-event indicator.
  events_between_convergence_checks: 5000
  # Update one terminal line with the completed HepMC event count.
  # Set false in a user YAML file to disable it.
  hepmc_progress: true

analysis_defaults:
  ATLAS_EXOT_2019_04:
    settings:
      jet_collections:
        antikt_R04:
          algorithm: "antikt"
          R: 0.4
          recombination_scheme: "E_scheme"
          strategy: "Best"
        antikt_R10:
          algorithm: "antikt"
          R: 1.0
          recombination_scheme: "E_scheme"
          strategy: "Best"
        VRTrackJets:
          algorithm: "VariableR"
          rho: 30.0
          Rmin: 0.02
          Rmax: 0.40
          pt_min: 5.0
